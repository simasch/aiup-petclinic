# The architecture rules are the harness for use cases that are not written yet,
# so a rule may legitimately match no classes: on a branch where only UC-001
# exists there is no domain package and no repository to check. A rule about
# code that does not exist is vacuously satisfied — the same stance the
# traceability sensors take towards a use case that is not Done yet.
#
# See docs/architecture/development.md.
archRule.failOnEmptyShould=false
