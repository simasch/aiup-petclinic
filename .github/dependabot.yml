# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # jOOQ Pro comes from repsy, so the resolver needs those credentials - without
  # the registries entry Dependabot cannot resolve the dependency tree at all
  - package-ecosystem: "maven"
    directory: "/"
    registries:
      - repsy
    schedule:
      interval: "daily"
    groups:
      maven:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # One PR for all actions: they are pinned by SHA and are updated together
    groups:
      github-actions:
        patterns:
          - "*"
