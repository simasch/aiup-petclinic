# AIUP Studio - AI-assisted generation (UC-033 to UC-037, UC-044, UC-045, UC-047, UC-048).
#
# This file is created by the AIUP Studio during the setup (UC-042 BR-001) and should not
# be edited by hand - the Studio compares it against its template and offers the update
# when the two differ (UC-042 A2).
#
# The Studio triggers the workflow through workflow_dispatch. It runs the chosen skill of
# the chosen plugin and provides the result as a pull request (UC-033 BR-003); nothing is
# ever written to a branch directly.
name: AIUP Generate

# The correlation id is part of the run name so the Studio finds the run it triggered:
# workflow_dispatch does not return a run id of its own.
run-name: AIUP ${{ inputs.skill }} ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin the skill belongs to
        required: true
        # The name alone is not enough: flyway-migration, implement and playwright-test
        # exist in both stack plugins and mean different work in each.
        type: choice
        options:
          - aiup-core
          - aiup-vaadin-jooq
          - aiup-angular-jpa
      skill:
        description: Skill to run
        required: true
        # A fixed choice rather than free text: the value goes into the prompt. This is
        # the union of the skills of all plugins; the Studio only sends a combination
        # that exists in the chosen plugin.
        type: choice
        options:
          - requirements
          - use-case-diagram
          - use-case-spec
          - entity-model
          - reverse-engineer
          - flyway-migration
          - implement
          - browserless-test
          - spring-boot-test
          - vitest-test
          - playwright-test
      subject:
        description: Artifact or use case id the skill applies to
        required: false
        type: string
      correlation_id:
        description: Id of the run from the Studio
        required: true
        type: string
      max_turns:
        # UC-033 BR-007: a document skill writes one artifact out of another and is done
        # in a few dozen turns; code and tests need considerably more. The Studio sets
        # the value to match the skill.
        description: Upper limit of turns in Claude Code
        required: false
        default: "40"
        type: string
      timeout_minutes:
        description: Upper limit of the run time in minutes
        required: false
        default: "30"
        type: string

permissions:
  contents: write
  pull-requests: write
  # The Claude Code action exchanges an OIDC token for its GitHub token; without this
  # the run fails before the skill starts.
  id-token: write

# One run per repository; the Studio prevents parallel runs on its side as well
# (UC-033 BR-005).
concurrency:
  group: aiup-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # UC-033 BR-007: after this, a run without a result counts as failed. The Studio
    # applies the same deadline, so the run stops costing at the moment the Studio gives
    # up on it.
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run the skill
        uses: anthropics/claude-code-action@v1
        with:
          # Two ways to the AI access, one of them is enough: an API key from the
          # Anthropic Console or - with a Claude subscription - the token from
          # `claude setup-token`. Whichever secret is not set stays empty and is
          # ignored by the action.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Studio dispatches the workflow with the token of its GitHub App, so the
          # actor is a bot (`aiup-studio[bot]`, or whatever the app of a self-hosted
          # Studio is called) and the action would refuse to start. The name of the app
          # is not fixed, hence every bot is allowed: the only trigger is
          # workflow_dispatch, and GitHub grants that to write access only.
          allowed_bots: "*"
          plugin_marketplaces: https://github.com/AI-Unified-Process/marketplace.git
          # All plugins are installed, only the chosen one runs: telling them apart
          # would cost an extra step to save a few seconds of installation time.
          plugins: |
            aiup-core@ai-unified-process-marketplace
            aiup-vaadin-jooq@ai-unified-process-marketplace
            aiup-angular-jpa@ai-unified-process-marketplace
          prompt: /${{ inputs.plugin }}:${{ inputs.skill }} ${{ inputs.subject }}
          # The permission mode has to be set here: the action only grants it in its tag
          # mode (@claude in a comment), and a workflow_dispatch run is its agent mode,
          # where nothing but these arguments applies. Without it the skill is allowed to
          # read but not to write, and the run ends successfully without a single changed
          # file. Bypassing rather than accepting the edits because the code and test
          # skills verify their result with Maven, and that is a Bash call.
          #
          # git stays blocked: the changes are meant to stay in the working directory so
          # that the next step can turn them into a pull request. The deny rule outranks
          # the permission mode, so the block holds.
          claude_args: |
            --max-turns ${{ inputs.max_turns }}
            --permission-mode bypassPermissions
            --disallowedTools Bash(git:*)

      # UC-044 BR-002 / UC-045 BR-002: the status of the specification follows the merge.
      # The new status travels in the same pull request as the code it describes, so the
      # artifact says Implemented or Tested at the very moment the proposal is taken over
      # - and says nothing new while the pull request is only open or is rejected. Nobody
      # has to watch the pull request afterwards and no second commit follows the merge.
      - name: Advance the status of the specification
        if: inputs.subject != ''
        env:
          SKILL: ${{ inputs.skill }}
          # through the environment, not into the script: the subject is free text
          SUBJECT: ${{ inputs.subject }}
        run: |
          set -euo pipefail
          # Only the two steps that move the status of a use case. The end-to-end test
          # follows a test case, not a use case, and moves nothing (UC-045 BR-001).
          case "$SKILL" in
            implement)
              target=3; english=Implemented; german=Implementiert ;;
            browserless-test | spring-boot-test | vitest-test)
              target=4; english=Tested; german=Getestet ;;
            *)
              exit 0 ;;
          esac
          # The subject of these steps is the path of the specification (UC-016 BR-002).
          # A subject that is an id names no file and is left alone.
          if [ ! -f "$SUBJECT" ]; then
            echo "No specification at \`$SUBJECT\`; the status was left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A run that produced nothing has no result to take over; without this check the
          # pull request would carry the new status and nothing else.
          if [ -z "$(git status --porcelain)" ]; then
            echo "The skill changed nothing; the status was left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          current=$(sed -n -e 's/^\*\*Status:\*\*[[:space:]]*\([^[:space:]]*\).*/\1/p' \
            -e '/^\*\*Status:\*\*/q' "$SUBJECT")
          # The AIUP status values in their order, English and German (UC-020 BR-003).
          # LC_ALL=C keeps the lowercasing to ASCII, so the umlaut of "Geprüft" survives.
          case "$(printf '%s' "$current" | LC_ALL=C tr '[:upper:]' '[:lower:]')" in
            draft | entwurf) rank=0 ;;
            reviewed | geprüft) rank=1 ;;
            approved | genehmigt) rank=2 ;;
            implemented | implementiert) rank=3 ;;
            tested | getestet) rank=4 ;;
            done | abgeschlossen) rank=5 ;;
            # Obsolete, a value the format does not know, or no status line at all: none
            # of them is a state this run may advance out of.
            *) rank=-1 ;;
          esac
          # Forward only, and only out of a status the step is allowed at: below Approved
          # neither the implementation nor the tests are a step of the process (UC-044,
          # UC-045 preconditions), and a status already at or beyond the one this run
          # stands for never moves backwards.
          if [ "$rank" -lt 2 ] || [ "$rank" -ge "$target" ]; then
            echo "Status \`$current\` of \`$SUBJECT\` was left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A specification is written back in the language it is written in (UC-010).
          if grep -qE '^\*\*Use-Case-ID:\*\*|^## Übersicht' "$SUBJECT"; then
            value=$german
          else
            value=$english
          fi
          # Only the first status line, and the trailing spaces of a Markdown hard break
          # are kept - dropping them would join the line with the one below it.
          sed -i "0,/^\*\*Status:\*\*/s/^\(\*\*Status:\*\*\)[[:space:]]*[^[:space:]]*\([[:space:]]*\)\$/\1 $value\2/" "$SUBJECT"
          echo "Status of \`$SUBJECT\`: $current -> $value" >> "$GITHUB_STEP_SUMMARY"

      # UC-033 BR-003: title and description name the artifact the run was set on. The
      # subject is not decoration - without it the pull request reads as "AIUP: implement"
      # next to every other one, and nobody can tell which change to which use case led to
      # which proposal (UC-018).
      #
      # The branch keeps its shape `aiup/<skill>-<correlation id>`: the Studio rebuilds
      # that name to find the pull request of a run again (`GenerationService.headBranch`),
      # so the subject must not enter it.
      - name: Provide the result as a pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: aiup/${{ inputs.skill }}-${{ inputs.correlation_id }}
          delete-branch: true
          # The subject is passed through as it stands - a path or an id, depending on the
          # skill. Parsing an id out of it would be guesswork: an AIUP id may itself carry
          # hyphens, so `UC-013-benutzer-einladen` cannot be split reliably.
          title: "${{ inputs.subject != '' && format('AIUP: {0} {1}', inputs.skill, inputs.subject) || format('AIUP: {0}', inputs.skill) }}"
          commit-message: "${{ inputs.subject != '' && format('AIUP: {0} {1}', inputs.skill, inputs.subject) || format('AIUP: {0}', inputs.skill) }}"
          body: |
            Generated by the AIUP Studio with the skill `${{ inputs.plugin }}:${{ inputs.skill }}`.

            ${{ inputs.subject != '' && format('Basis: `{0}`', inputs.subject) || 'The skill works on the repository as a whole; there is no single basis artifact.' }}

            The content is a proposal and is to be reviewed before it is taken over.

            aiup-run: ${{ inputs.correlation_id }}

      - name: Summarise the result
        run: |
          if [ -n "${{ steps.pr.outputs.pull-request-number }}" ]; then
            echo "Pull request #${{ steps.pr.outputs.pull-request-number }}: ${{ steps.pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The skill produced no changes; no pull request was created." >> "$GITHUB_STEP_SUMMARY"
          fi
